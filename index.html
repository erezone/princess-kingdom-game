<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרפתקת הנסיכה בממלכה</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <div id="game-container">
    <div id="renderer-wrap"></div>

    <div id="start-screen">
      <h1>👑 הרפתקת הנסיכה בממלכה 👑</h1>
      <p class="subtitle">משחק תלת-מימדי בגוף ראשון</p>
      <p>חקרי את הטירה, הכפר והיער הקסום, ואספי את כל אבני החן!</p>
      <div class="controls-info">
        <p><strong>בקרה:</strong></p>
        <p>W / ↑ — קדימה &nbsp;&nbsp; S / ↓ — אחורה</p>
        <p>A — הצידה שמאלה &nbsp;&nbsp; D — הצידה ימינה</p>
        <p>עכבר — הסתכלות (לחצי על המסך)</p>
        <p>רווח — דיבור עם דמויות</p>
        <p>M — מפה</p>
      </div>
      <button id="startBtn">התחילי הרפתקה</button>
    </div>

    <div id="hud">
      <div id="gem-count">💎 <span id="gems">10 / 0</span></div>
      <div id="zone-name"></div>
    </div>

    <div id="interact-hint" class="hidden">לחצי רווח לדבר 🗣️</div>

    <div id="dialog-box" class="hidden">
      <div id="dialog-speaker"></div>
      <div id="dialog-text"></div>
      <div id="dialog-prompt">לחצי רווח להמשיך</div>
    </div>

    <div id="crosshair">
      <div class="ch ch-h"></div>
      <div class="ch ch-v"></div>
    </div>

    <canvas id="minimapCanvas"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js?v=7"></script>
</body>
</html>
