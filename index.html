<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Princess Kingdom Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="start-screen">
      <h1>👑 Princess Kingdom Adventure 👑</h1>
      <p>Explore your magical kingdom, talk to villagers, and collect gems!</p>
      <div class="controls-info">
        <p><strong>Controls:</strong></p>
        <p>🎮 Arrow Keys / WASD — Move</p>
        <p>🗣️ Space — Talk to villagers</p>
      </div>
      <button id="startBtn">Begin Adventure</button>
    </div>
    <div id="hud">
      <div id="gem-count">💎 <span id="gems">0</span></div>
      <div id="zone-name"></div>
      <div id="quest-tracker"></div>
    </div>
    <div id="dialog-box" class="hidden">
      <div id="dialog-speaker"></div>
      <div id="dialog-text"></div>
      <div id="dialog-prompt">Press Space to continue</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
