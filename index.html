<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרפתקת הנסיכה בממלכה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="start-screen">
      <h1>👑 הרפתקת הנסיכה בממלכה 👑</h1>
      <p>!חקרי את הממלכה הקסומה, דברי עם תושבים ואספי אבני חן</p>
      <div class="controls-info">
        <p><strong>:בקרה</strong></p>
        <p>🎮 חצים / WASD — תנועה</p>
        <p>🗣️ רווח — דיבור עם דמויות</p>
      </div>
      <button id="startBtn">התחילי הרפתקה</button>
    </div>
    <div id="hud">
      <div id="gem-count">💎 <span id="gems">0</span></div>
      <div id="zone-name"></div>
      <div id="quest-tracker"></div>
    </div>
    <div id="dialog-box" class="hidden">
      <div id="dialog-speaker"></div>
      <div id="dialog-text"></div>
      <div id="dialog-prompt">לחצי רווח להמשיך</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
